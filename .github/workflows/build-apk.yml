name: Build Android APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Criar uma release no GitHub com o APK anexado?'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🧹 Liberar Espaço em Disco no Runner
        run: |
          echo "=== Espaço em disco antes da limpeza ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          echo "=== Espaço em disco após limpeza ==="
          df -h /

      - name: 🟢 Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Configurar Java JDK (17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar Dependências
        run: npm install

      - name: 🧪 Executar Testes Automatizados (428 testes)
        run: npm test

      - name: 🔍 Verificação de Tipos TypeScript (Strict)
        run: npm run typecheck

      - name: 💾 Aumentar Swap de Memória
        run: |
          sudo fallocate -l 4G /swapfile_extra || true
          sudo chmod 600 /swapfile_extra || true
          sudo mkswap /swapfile_extra || true
          sudo swapon /swapfile_extra || true
          free -h

      - name: ⚙️ Expo Prebuild (Gerar Projeto Android Nativo)
        run: |
          npx expo prebuild --platform android --clean --no-install
          
          # Ajustar limites de memória do JVM/Gradle para evitar OutOfMemoryError sem esgotar RAM do runner
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC/g' android/gradle.properties
          sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/g' android/gradle.properties
          # Focar nas arquiteturas de smartphones e tablets reais (ARM), ignorando x86 de emulador legado
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/g' android/gradle.properties

      - name: 🔨 Compilar APK Release (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon --no-parallel --stacktrace

      - name: 🏷️ Organizar APK para Publicação
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/Pilates-Espaco-Mulher-v1.1.0.apk \;

      - name: 📤 Fazer Upload do APK como Artefato da Build
        uses: actions/upload-artifact@v4
        with:
          name: Pilates-Espaco-Mulher-APK
          path: build-output/*.apk
          retention-days: 30

      - name: 🚀 Publicar Release no GitHub (com APK anexado)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: "Pilates Espaço Mulher v1.1.0"
          tag_name: "v1.1.0-build${{ github.run_number }}"
          body: |
            ## 🌸 Pilates Espaço Mulher — Dra. Rogéria Collares (CREFITO 23093-F)
            ### Versão Oficial v1.1.0 (Build #${{ github.run_number }})
            
            Aplicativo mobile nativo para avaliação fisioterapêutica postural, bioimpedância, agenda e prescrição de Pilates.
            
            #### 📱 Destaques desta Versão (Expansão Clínica v1.1.0):
            - 📸 **Fotos Clínicas & Galeria de Condições**: Captura e categorização de fotos clínicas (Postura, Escoliose, Cicatriz, Edema, Diástase, etc.) com armazenamento 100% local e seguro no dispositivo.
            - 👤 **Foto de Perfil & Novos Dados**: Avatar circular (88x88 com iniciais de fallback), E-mail, Profissão, Tempo de atividade e Estado civil.
            - 🏥 **Convênios e Parcerias**: Suporte nativo para Particular, Totalpass, Gympass, IBNJ e Outros (com especificação personalizada).
            - 🤰 **Anamnese & Histórico Clínico**: Campo expandido de Histórico Clínico, reformulação de Gestação (partos, tipo Normal/Cesárea/Ambos, tempo da última gestação e abortos).
            - 📐 **Avaliação Postural**: Adição de Alinhamento de Quadril (Nivelado, Elevado D/E, Anteversão, Retroversão, Rotações).
            - ⚖️ **Bioimpedância & Idade Corporal**: Idade cronológica, idade corporal com indicador de vitalidade metabólica e Modal com Tabelas de Referência Clínica didáticas (Circunferência Abdominal, % Gordura Pollock, Gordura Visceral e Água Corporal).
            - 📄 **Relatório Clínico PDF A4 Atualizado**: Inclusão de foto de perfil, dados obstétricos, alinhamento de quadril e anexo fotográfico opcional de condições.
            - 🔒 **100% Local-First**: Zero banco de dados externo, sem tela de login, dados e fotos salvos com privacidade total.
            
            #### 📥 Download do APK:
            Baixe o arquivo **`Pilates-Espaco-Mulher-v1.1.0.apk`** abaixo e instale diretamente no seu dispositivo Android.
          files: build-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
